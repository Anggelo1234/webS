<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document equide</title>

    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container-fluid">
        <form action="/action_page.php">
            <div class="field">
                    <label for="name">Nombre</label>
                    <div class="input-wrap" data-field>
                        <input id="name" name="name" type="text" placeholder="Ada Lovelace" autocomplete="name" required>
                        <span class="focus-ring"></span>
                        <span class="hint">Ingresa tu nombre completo</span>
                    </div>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-wrap" data-field>
                        <input id="email" name="email" type="email" placeholder="neo@matrix.io" autocomplete="email" required>
                        <span class="focus-ring"></span>
                        <span class="hint">Usa un correo válido</span>
                    </div>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap" data-field>
                        <input id="password" name="password" type="password" placeholder="••••••••" minlength="6" required>
                        <button class="ghost-btn" type="button" id="togglePass" aria-label="Mostrar contraseña">👁️</button>
                        <span class="focus-ring"></span>
                        <span class="hint">Mínimo 6 caracteres</span>
                    </div>
                </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
